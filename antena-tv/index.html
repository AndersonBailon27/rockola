<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Antena TV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: reproductor fijo arriba (celular) o a la izquierda (pantalla ancha); guía de canales al lado. Un solo tema oscuro, de sala de TV. */
:root{
  color-scheme:dark;
  --bg:#0e1517;
  --surface:#172124;
  --surface-2:#1f2c30;
  --line:#2b3a3f;
  --text:#e9f0f1;
  --muted:#8fa3a9;
  --accent:#ff7a59;
  --accent-ink:#2a0f06;
  --warn:#ffc857;
  --display:"Bricolage Grotesque","Trebuchet MS",sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.4;display:flex;flex-direction:column}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line)}
.brand{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:-.02em;margin-right:auto}
.brand span{color:var(--accent)}
select,input[type=search],input[type=url],input[type=text]{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-width:0}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:9px 14px;font-weight:700}
.btn.ghost{background:var(--surface-2);color:var(--text);border:1px solid var(--line);font-weight:500}
#listSel{max-width:210px}

main{flex:1;min-height:0;display:flex;flex-direction:column}
.stage{background:#000;position:relative;aspect-ratio:16/9;max-height:42vh;width:100%;flex:none}
video{width:100%;height:100%;display:block;background:#000}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:16px;pointer-events:none;background:rgba(0,0,0,.55)}
.overlay[hidden]{display:none}
.overlay strong{font-family:var(--display);font-size:18px}
.overlay small{color:var(--muted);max-width:42ch}
.now{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);flex:none}
.now .dot{width:8px;height:8px;border-radius:50%;background:var(--line);flex:none}
.now.live .dot{background:var(--accent);box-shadow:0 0 0 4px rgba(255,122,89,.2)}
.now b{font-family:var(--display);font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.now span{color:var(--muted);font-size:13px;margin-left:auto;white-space:nowrap}

.guide{flex:1;min-height:0;display:flex;flex-direction:column}
.tools{display:flex;flex-wrap:wrap;gap:8px;padding:10px 16px}
.tools input{flex:1 1 150px}
.tools select{flex:1 1 130px}
.tabs{display:flex;gap:4px;padding:0 16px 8px}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:6px 10px;color:var(--muted);font-weight:700}
.tab[aria-selected=true]{color:var(--text);border-color:var(--accent)}
.count{margin-left:auto;color:var(--muted);font-size:13px;align-self:center;font-variant-numeric:tabular-nums}
#list{flex:1;min-height:0;overflow-y:auto;padding:0 8px 16px;list-style:none;margin:0}
.ch{display:flex;align-items:center;gap:10px;border-radius:10px;padding:2px 4px 2px 8px}
.ch:hover{background:var(--surface)}
.ch.on{background:var(--surface-2);box-shadow:inset 3px 0 0 var(--accent)}
.ch .play{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:none;border:0;text-align:left;padding:7px 0}
.logo{width:44px;height:32px;flex:none;border-radius:6px;background:var(--surface-2);display:grid;place-items:center;overflow:hidden;font-family:var(--display);font-size:13px;color:var(--muted)}
.logo img{max-width:100%;max-height:100%;object-fit:contain}
.meta{min-width:0}
.meta b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta small{color:var(--muted);font-size:12px}
.fav{background:none;border:0;font-size:20px;line-height:1;padding:8px;color:var(--line)}
.fav[aria-pressed=true]{color:var(--warn)}
.note{padding:18px 16px;color:var(--muted)}
.more{display:block;margin:10px auto}

dialog{background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:18px;width:min(440px,calc(100% - 32px))}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog h2{font-family:var(--display);margin:0 0 4px;font-size:20px;text-wrap:balance}
dialog p{color:var(--muted);margin:0 0 12px;font-size:13px}
dialog label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
dialog input[type=text],dialog input[type=url]{width:100%}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
#dlgErr{color:var(--warn);font-size:13px;margin-top:10px;min-height:1em}

@media (min-width:900px){
  main{flex-direction:row}
  .left{flex:1;min-width:0;display:flex;flex-direction:column;border-right:1px solid var(--line)}
  .stage{max-height:none;flex:0 1 auto}
  .guide{flex:0 0 400px}
}
</style>
</head>
<body>
<header>
  <div class="brand">Antena<span>TV</span></div>
  <select id="listSel" aria-label="Lista de canales"></select>
  <button class="btn" id="addBtn">Agregar lista</button>
</header>

<main>
  <div class="left">
    <div class="stage">
      <video id="video" controls playsinline></video>
      <div class="overlay" id="overlay"><strong id="ovTitle">Elige un canal</strong><small id="ovText">Toca cualquier canal de la guía para empezar a ver.</small></div>
    </div>
    <div class="now" id="now"><i class="dot"></i><b id="nowName">Sin canal</b><span id="nowGroup"></span></div>
  </div>

  <section class="guide">
    <div class="tools">
      <input type="search" id="q" placeholder="Buscar canal" aria-label="Buscar canal">
      <select id="groupSel" aria-label="Categoría"></select>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tabAll" aria-selected="true">Canales</button>
      <button class="tab" role="tab" id="tabFav" aria-selected="false">Favoritos</button>
      <span class="count" id="count"></span>
    </div>
    <ul id="list"></ul>
  </section>
</main>

<dialog id="dlg">
  <form id="dlgForm">
    <h2>Agregar tu lista de canales</h2>
    <p>Pega el enlace M3U que te dio tu proveedor o sube el archivo .m3u. Usa solo listas de servicios con licencia o de canales gratuitos.</p>
    <label for="lName">Nombre</label>
    <input type="text" id="lName" placeholder="Mi lista" maxlength="40">
    <label for="lUrl">Enlace M3U</label>
    <input type="url" id="lUrl" placeholder="https://…/lista.m3u">
    <label for="lFile">O sube un archivo .m3u</label>
    <input type="file" id="lFile" accept=".m3u,.m3u8,.txt,audio/x-mpegurl">
    <div id="dlgErr" role="alert"></div>
    <div class="row">
      <button type="button" class="btn ghost" id="dlgDel" hidden>Quitar lista actual</button>
      <button type="button" class="btn ghost" id="dlgCancel">Cancelar</button>
      <button type="submit" class="btn">Cargar lista</button>
    </div>
  </form>
</dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.17/hls.min.js"></script>
<script>
(function(){
'use strict';
var BASE='https://iptv-org.github.io/iptv/';
var PRESETS=[
  {id:'p-pe',name:'Perú',url:BASE+'countries/pe.m3u'},
  {id:'p-spa',name:'En español',url:BASE+'languages/spa.m3u'},
  {id:'p-news',name:'Noticias',url:BASE+'categories/news.m3u'},
  {id:'p-sports',name:'Deportes',url:BASE+'categories/sports.m3u'},
  {id:'p-music',name:'Música',url:BASE+'categories/music.m3u'},
  {id:'p-movies',name:'Canales de cine',url:BASE+'categories/movies.m3u'},
  {id:'p-series',name:'Canales de series',url:BASE+'categories/series.m3u'},
  {id:'p-kids',name:'Infantil',url:BASE+'categories/kids.m3u'},
  {id:'p-doc',name:'Documentales',url:BASE+'categories/documentary.m3u'}
];
var PAGE=120;
var $=function(id){return document.getElementById(id)};
var video=$('video'),listEl=$('list'),listSel=$('listSel'),groupSel=$('groupSel'),q=$('q');
var store={
  get:function(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
  set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
var saved=store.get('atv.lists',[]);     // [{id,name,url?,text?}]
var favs=store.get('atv.favs',[]);       // [{name,url,logo,group}]
var channels=[],tab='all',shown=PAGE,current=null,hls=null,playToken=0;

function parseM3U(text){
  var out=[],lines=text.split(/\r?\n/),info=null;
  for(var i=0;i<lines.length;i++){
    var l=lines[i].trim();
    if(!l)continue;
    if(l.indexOf('#EXTINF')===0){
      var a={},re=/([\w-]+)="([^"]*)"/g,m;
      while((m=re.exec(l)))a[m[1].toLowerCase()]=m[2];
      var rest=l.replace(/[\w-]+="[^"]*"/g,'');
      info={name:rest.slice(rest.indexOf(',')+1).trim()||a['tvg-name']||'Canal',logo:a['tvg-logo']||'',group:(a['group-title']||'').split(';')[0]||'Sin categoría'};
    }else if(l.charAt(0)!=='#'){
      if(/^(https?:)?\/\//i.test(l)){
        var c=info||{name:'Canal '+(out.length+1),logo:'',group:'Sin categoría'};
        c.url=l;out.push(c);
      }
      info=null;
    }
  }
  return out;
}

function allLists(){return PRESETS.concat(saved)}
function fillListSel(sel){
  listSel.textContent='';
  var g1=document.createElement('optgroup');g1.label='Canales gratuitos';
  PRESETS.forEach(function(p){g1.appendChild(new Option(p.name,p.id))});
  listSel.appendChild(g1);
  if(saved.length){
    var g2=document.createElement('optgroup');g2.label='Mis listas';
    saved.forEach(function(p){g2.appendChild(new Option(p.name,p.id))});
    listSel.appendChild(g2);
  }
  listSel.value=sel;
  if(listSel.value!==sel)listSel.value=PRESETS[0].id;
}

function note(msg){listEl.textContent='';var li=document.createElement('li');li.className='note';li.textContent=msg;listEl.appendChild(li);$('count').textContent=''}

function loadList(id){
  var L=allLists().filter(function(x){return x.id===id})[0]||PRESETS[0];
  store.set('atv.last',L.id);
  fillListSel(L.id);
  channels=[];note('Cargando «'+L.name+'»…');
  var p=L.text?Promise.resolve(L.text):fetch(L.url).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.text()});
  return p.then(function(t){
    channels=parseM3U(t);
    if(!channels.length)throw new Error('vacía');
    fillGroups();shown=PAGE;render();
  }).catch(function(){
    channels=[];fillGroups();
    note('No se pudo cargar «'+L.name+'». Revisa tu conexión o el enlace. Si el servidor de tu proveedor bloquea el acceso desde el navegador, descarga el archivo .m3u y súbelo con «Agregar lista».');
  });
}

function fillGroups(){
  var counts={};
  channels.forEach(function(c){counts[c.group]=(counts[c.group]||0)+1});
  var names=Object.keys(counts).sort(function(a,b){return a.localeCompare(b,'es')});
  groupSel.textContent='';
  groupSel.appendChild(new Option('Todas las categorías',''));
  names.forEach(function(n){groupSel.appendChild(new Option(n+' ('+counts[n]+')',n))});
}

function isFav(c){return favs.some(function(f){return f.url===c.url})}
function toggleFav(c){
  if(isFav(c))favs=favs.filter(function(f){return f.url!==c.url});
  else favs.push({name:c.name,url:c.url,logo:c.logo,group:c.group});
  store.set('atv.favs',favs);render();
}

function filtered(){
  var src=tab==='fav'?favs:channels,term=q.value.trim().toLowerCase(),g=groupSel.value;
  return src.filter(function(c){
    return(!term||c.name.toLowerCase().indexOf(term)>=0)&&(tab==='fav'||!g||c.group===g);
  });
}

function row(c){
  var li=document.createElement('li');li.className='ch'+(current&&current.url===c.url?' on':'');
  var b=document.createElement('button');b.className='play';b.type='button';
  var lg=document.createElement('span');lg.className='logo';
  if(c.logo){
    var img=new Image();img.loading='lazy';img.alt='';img.referrerPolicy='no-referrer';
    img.onerror=function(){lg.textContent=c.name.charAt(0).toUpperCase()};
    img.src=c.logo;lg.appendChild(img);
  }else lg.textContent=c.name.charAt(0).toUpperCase();
  var m=document.createElement('span');m.className='meta';
  var n=document.createElement('b');n.textContent=c.name;
  var s=document.createElement('small');s.textContent=c.group;
  m.appendChild(n);m.appendChild(s);b.appendChild(lg);b.appendChild(m);
  b.addEventListener('click',function(){play(c)});
  var f=document.createElement('button');f.className='fav';f.type='button';f.textContent='★';
  var on=isFav(c);f.setAttribute('aria-pressed',on);f.setAttribute('aria-label',(on?'Quitar de':'Agregar a')+' favoritos: '+c.name);
  f.addEventListener('click',function(){toggleFav(c)});
  li.appendChild(b);li.appendChild(f);return li;
}

function render(){
  var items=filtered();
  $('count').textContent=items.length+(items.length===1?' canal':' canales');
  if(!items.length){
    note(tab==='fav'?'Aún no tienes favoritos. Toca la estrella de un canal para guardarlo aquí.':(channels.length?'Ningún canal coincide con tu búsqueda.':'Esta lista no tiene canales.'));
    $('count').textContent='0 canales';return;
  }
  var top=listEl.scrollTop,frag=document.createDocumentFragment();
  items.slice(0,shown).forEach(function(c){frag.appendChild(row(c))});
  if(items.length>shown){
    var li=document.createElement('li'),mb=document.createElement('button');
    mb.className='btn ghost more';mb.type='button';mb.textContent='Mostrar más canales';
    mb.addEventListener('click',function(){shown+=PAGE;render()});
    li.appendChild(mb);frag.appendChild(li);
  }
  listEl.textContent='';listEl.appendChild(frag);listEl.scrollTop=top;
}

function overlay(title,text){
  var o=$('overlay');
  if(!title){o.hidden=true;return}
  o.hidden=false;$('ovTitle').textContent=title;$('ovText').textContent=text||'';
}
function stop(){
  if(hls){try{hls.destroy()}catch(e){}hls=null}
  video.removeAttribute('src');try{video.load()}catch(e){}
}
function fail(token){
  if(token!==playToken)return;
  stop();$('now').classList.remove('live');
  overlay('Este canal no responde','Puede estar fuera del aire o no permitir verse desde el navegador. Prueba con otro canal.');
}
function playNative(c,token){
  if(token!==playToken)return;
  if(hls){try{hls.destroy()}catch(e){}hls=null}
  video.src=c.url;
  video.play().catch(function(){});
}
function play(c){
  var token=++playToken;
  current=c;stop();
  $('nowName').textContent=c.name;$('nowGroup').textContent=c.group;$('now').classList.remove('live');
  overlay('Conectando…',c.name);
  render();
  var isHls=/\.m3u8?($|\?)/i.test(c.url)||!/\.(mp4|webm|mp3|aac|ogg|mkv|ts)($|\?)/i.test(c.url);
  if(isHls&&window.Hls&&Hls.isSupported()){
    hls=new Hls({enableWorker:true,lowLatencyMode:false});
    hls.on(Hls.Events.ERROR,function(_,d){
      if(!d.fatal||token!==playToken)return;
      if(d.type===Hls.ErrorTypes.MEDIA_ERROR&&!hls._retried){hls._retried=true;hls.recoverMediaError();return}
      playNative(c,token); // segundo intento: reproductor propio del navegador
    });
    hls.loadSource(c.url);hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED,function(){video.play().catch(function(){})});
  }else playNative(c,token);
  store.set('atv.lastCh',{name:c.name,url:c.url,logo:c.logo,group:c.group});
}
video.addEventListener('playing',function(){overlay(null);$('now').classList.add('live')});
video.addEventListener('waiting',function(){if(current)overlay('Cargando…',current.name)});
video.addEventListener('error',function(){if(current&&!hls)fail(playToken)});

// Controles
listSel.addEventListener('change',function(){q.value='';loadList(listSel.value)});
groupSel.addEventListener('change',function(){shown=PAGE;listEl.scrollTop=0;render()});
q.addEventListener('input',function(){shown=PAGE;listEl.scrollTop=0;render()});
function setTab(t){
  tab=t;shown=PAGE;listEl.scrollTop=0;
  $('tabAll').setAttribute('aria-selected',t==='all');$('tabFav').setAttribute('aria-selected',t==='fav');
  groupSel.disabled=t==='fav';render();
}
$('tabAll').addEventListener('click',function(){setTab('all')});
$('tabFav').addEventListener('click',function(){setTab('fav')});

// Diálogo para agregar listas
var dlg=$('dlg');
$('addBtn').addEventListener('click',function(){
  $('dlgForm').reset();$('dlgErr').textContent='';
  $('dlgDel').hidden=!saved.some(function(s){return s.id===listSel.value});
  if(dlg.showModal)dlg.showModal();else dlg.setAttribute('open','');
});
$('dlgCancel').addEventListener('click',function(){dlg.close()});
$('dlgDel').addEventListener('click',function(){
  saved=saved.filter(function(s){return s.id!==listSel.value});
  store.set('atv.lists',saved);dlg.close();loadList(PRESETS[0].id);
});
$('dlgForm').addEventListener('submit',function(e){
  e.preventDefault();
  var name=$('lName').value.trim()||'Mi lista',url=$('lUrl').value.trim(),file=$('lFile').files[0],err=$('dlgErr');
  function add(entry){
    entry.id='u-'+Date.now();entry.name=name;
    saved.push(entry);store.set('atv.lists',saved);
    dlg.close();setTab('all');loadList(entry.id);
  }
  if(file){
    var fr=new FileReader();
    fr.onload=function(){
      if(!parseM3U(String(fr.result)).length){err.textContent='Ese archivo no parece una lista M3U con canales.';return}
      add({text:String(fr.result)});
    };
    fr.onerror=function(){err.textContent='No se pudo leer el archivo.'};
    fr.readAsText(file);
  }else if(/^https?:\/\//i.test(url)){
    add({url:url});
  }else err.textContent='Pega un enlace que empiece con http o sube un archivo .m3u.';
});

// Arranque
var last=store.get('atv.lastCh',null);
if(last){current=last;$('nowName').textContent=last.name;$('nowGroup').textContent=last.group;overlay('Seguir viendo '+last.name,'Tócalo en la guía o en Favoritos para reanudar.');current=null}
loadList(store.get('atv.last',PRESETS[0].id));
})();
</script>
</body>
</html>
